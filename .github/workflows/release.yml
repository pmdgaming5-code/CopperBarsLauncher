name: Windows Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller pytest
          choco install innosetup -y --no-progress
      - name: Compile
        shell: pwsh
        run: python -m compileall -q .
      - name: Test
        shell: pwsh
        run: pytest -q
      - name: Build EXE
        shell: pwsh
        run: |
          if (Test-Path dist) { Remove-Item dist -Recurse -Force }
          if (Test-Path build) { Remove-Item build -Recurse -Force }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name CopperBarsLauncher launcher.py
          if (-not (Test-Path 'dist/CopperBarsLauncher.exe')) { throw 'EXE build failed' }
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($iscc) {
            & $iscc.Source installer\CopperBarsLauncher.iss
          } else {
            $candidates = @(
              "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
            )
            $isccPath = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $isccPath) { throw 'Inno Setup compiler not found' }
            & $isccPath installer\CopperBarsLauncher.iss
          }
          $installer = Get-ChildItem -Path . -Filter 'CopperBarsLauncher-Setup-*.exe' -Recurse | Select-Object -First 1
          if (-not $installer) { throw 'Installer EXE not found' }
          Copy-Item $installer.FullName 'dist\CopperBarsLauncher-Setup-2.0.0.exe' -Force
      - name: Smoke test executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath .\dist\CopperBarsLauncher.exe -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            if ($process.ExitCode -ne 0) { throw "Launcher exited with code $($process.ExitCode)" }
          } else {
            Stop-Process -Id $process.Id -Force
          }
      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ($env:GITHUB_REF_NAME -like 'v*') { $env:GITHUB_REF_NAME } else { 'v2.0.0' }
          gh release create $tag `
            "dist/CopperBarsLauncher.exe" `
            "dist/CopperBarsLauncher-Setup-2.0.0.exe" `
            --repo "${{ github.repository }}" `
            --title "CopperBars Launcher $tag" `
            --generate-notes
