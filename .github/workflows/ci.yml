name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Compile-check source
        run: python -m py_compile launcher.py tests/test_launcher.py

      - name: Install test tools
        run: python -m pip install --disable-pip-version-check -U pip pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Validate packaging files
        shell: bash
        run: |
          test -f installer/CopperBarsLauncher.iss
          test -f build/build.ps1
          test -f .github/workflows/release.yml
          test -s launcher.py
