name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test tools
        run: python -m pip install -U pip pytest
      - name: Compile every Python module
        run: python -m compileall -q .
      - name: Import launcher entrypoint
        run: python -c "import launcher; print('launcher import OK')"
      - name: Unit tests
        run: pytest -q
